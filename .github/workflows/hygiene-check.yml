name: hygiene-check

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full clone so the event range resolves. The secret scan passes that range only.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Free-only hygiene + pack sync
        run: python3 scripts/check-hygiene.py
      - name: Pack sync check
        run: python3 scripts/sync-packs.py --check
      - name: Pack tooling unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Zip scan
        run: python3 scripts/build-packs.py
      - name: Committed config guard
        run: |
          # secret-scan-guard-start
          set -euo pipefail
          found_file="$(mktemp)"
          trap 'rm -f "${found_file}"' EXIT
          find . -name .git -prune -o -name '.gitleaks*' -print -quit >"${found_file}"
          found="$(cat "${found_file}")"
          if [ -n "${found}" ]; then
            printf '%s\n' "secret scan refused a committed config or ignore file: ${found}"
            exit 1
          fi
          printf '%s\n' "secret scan config guard: no committed config or ignore file"
          # secret-scan-guard-end
      - name: Commit trailer check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          is_sha() { printf '%s' "$1" | grep -Eq '^[0-9a-f]{40}$'; }
          zero="0000000000000000000000000000000000000000"
          range=""
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            is_sha "${BASE_SHA}" && is_sha "${HEAD_SHA}" || { printf '%s\n' "pull request range is not two commits"; exit 1; }
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ "${EVENT_NAME}" = "push" ]; then
            if [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "${zero}" ]; then
              is_sha "${BEFORE_SHA}" && is_sha "${AFTER_SHA}" || { printf '%s\n' "push range is not two commits"; exit 1; }
              range="${BEFORE_SHA}..${AFTER_SHA}"
            else
              printf '%s\n' "trailer check range skipped"
            fi
          else
            printf '%s\n' "trailer check event is not a pull request or push"
            exit 1
          fi
          if [ -z "${range}" ]; then
            exit 0
          fi
          list="$(mktemp)"
          msgfile="$(mktemp)"
          trap 'rm -f "${list}" "${msgfile}"' EXIT
          git rev-list "${range}" >"${list}"
          bad=0
          while IFS= read -r commit || [ -n "${commit}" ]; do
            [ -n "${commit}" ] || continue
            git show -s --format=%B "${commit}" >"${msgfile}"
            if grep -Eiq '^[[:space:]]*co-authored-by[[:space:]]*:' "${msgfile}"; then
              short="$(git rev-parse --short "${commit}")"
              printf '%s\n' "${short} commit message has a co-author trailer"
              bad=1
            fi
          done <"${list}"
          if [ "${bad}" -eq 1 ]; then
            exit 1
          fi
      - name: Secret scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          BINARY_SHA256: "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509"
          SCAN_CONFIG_SHA256: "9e66540bf992931a74bf926200494b6b9ac333b6b7d4e1abe71f2e529422d97a"
        run: |
          set -euo pipefail
          unset GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML || true
          version="8.30.1"
          archive="${RUNNER_TEMP}/archive.tar.gz"
          tool="${RUNNER_TEMP}/gitleaks"
          embedded="${RUNNER_TEMP}/embedded-config.toml"
          scan_config="${RUNNER_TEMP}/scan-config.toml"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL -o "${archive}" "${url}"
          echo "${ARCHIVE_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          chmod +x "${tool}"
          echo "${BINARY_SHA256}  ${tool}" | sha256sum -c -
          python3 - "${tool}" "${embedded}" << 'PY'
          import pathlib
          import sys
          prefix = b"# This file has been auto-generated. Do not edit manually.\n"
          data = pathlib.Path(sys.argv[1]).read_bytes()
          start = data.find(prefix)
          if start < 0 or data.find(prefix, start + len(prefix)) != -1:
              raise SystemExit("embedded config prefix missing")
          region = data[start:]
          nul = region.find(b"\x00")
          if nul < 0:
              raise SystemExit("embedded config is not bounded")
          pathlib.Path(sys.argv[2]).write_bytes(region[:nul])
          PY
          python3 scripts/scan-config.py --input "${embedded}" --output "${scan_config}"
          echo "${SCAN_CONFIG_SHA256}  ${scan_config}" | sha256sum -c -
          is_sha() { printf '%s' "$1" | grep -Eq '^[0-9a-f]{40}$'; }
          zero="0000000000000000000000000000000000000000"
          range=""
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            is_sha "${BASE_SHA}" && is_sha "${HEAD_SHA}" || { echo "pull request range is not two commits"; exit 1; }
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ "${EVENT_NAME}" = "push" ]; then
            if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "${zero}" ]; then
              is_sha "${BEFORE_SHA}" && is_sha "${AFTER_SHA}" || { echo "push range is not two commits"; exit 1; }
              range="${BEFORE_SHA}..${AFTER_SHA}"
            else
              echo "push range skipped"
            fi
          else
            echo "secret scan event is not a pull request or push"
            exit 1
          fi
          echo "${BINARY_SHA256}  ${tool}" | sha256sum -c -
          "${tool}" dir . --no-banner --redact --ignore-gitleaks-allow --config "${scan_config}"
          if [ -n "${range}" ]; then
            git cat-file -e "${range%%..*}^{commit}"
            git cat-file -e "${range##*..}^{commit}"
            echo "range ${range}"
            "${tool}" git . --no-banner --redact --ignore-gitleaks-allow --config "${scan_config}" --log-opts="--text ${range}"
          fi
