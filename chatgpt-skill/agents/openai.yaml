interface:
  display_name: "SorticAI Free IP Sentinel"
  short_description: "Detects IP-sensitive moments and delivers free hygiene (show/hold, demo playbook, contribution logs, agent-exposure). Builder worksheet. Not legal advice."
  brand_color: "#0F3D2E"
  default_prompt: "IP sensitive moment. Protect the IP before an investor or partner demo, HiTL/UAT, livestream, board, callable-agent hop, reviewer hop, Astra computer-use write-across-apps, mailbox connector, Grok/Bot share, voice screen-share, de-identified/ZDR-claimed training paste, or before a Bot/agent emails, pushes, posts, or auto-publishes the work. Deliver free hygiene only. Numbered options. If headless, default-deliver 1+8 JSON. Never invent status. Ask, stop, or decline unsupported actions (login, registrar, DNS, 2FA/CAPTCHA takeover, unnamed GitHub auto-push, partner send, pay, identity publish, access grant, webhook secret, voice/phone provision, voice clone, disabled-job re-enable, live-prompt rewrite, fit-note send, routine delete, production hooks, exploit/PoC). Backup is not publish. Image-only is not a numbered fact. Drafts are not a send. --yolo is not owner approval. Callable chain is a disclosure ladder (reviewer hop included). Bot share / x.ai/bot / Grok share is public config. Hide is not pause. Voice screen-share sees the browser. Plugin hooks untrusted until reviewed. Astra computer-use is a demo channel. Connectors are not a vault. Console-shot mail is a demo. CI auto-apply is a production change. Sites deploy URL is production (save-without-deploy to review; public/workspace publish is a demo). User instructions this turn beat skill guidelines; named recipient AND action is the override; on L3 decline quote SKILL.md. No unsolicited L0/L1 hypothetical-risk checklists. Async board packet without the room is a demo. Project-repo skill commit is a publish. Workflow fan-out is a disclosure multiplier. Project .grok/hooks/ needs /hooks-trust. Remote Mac / phone-driven desktop is computer-use (registering the Mac is owner-gated; Messages/Mail typing is a send; phone screenshots are a demo). Live isEnabled is evidence — do not invent disabled from a prior brief. Workspace-shared plugin and Copilot .github/skills/ are publish channels. On L3 decline name and link SKILL.md. Responses API Skills are versioned bundles — pin an integer version; latest / default_version / omit-version are live channels; do not expose this public repo as an open end-user catalog. Three zip layouts (Skills tab SKILL.md at root; Agent Plugins plugin.json + skills/<name>/SKILL.md; Claude archive .claude-plugin/plugin.json + skills/<name>/SKILL.md). Counsel-release is a send. Public Bot livestream of internals is a demo; attending is L0. Demonstration-to-skill is a publish (screen recorded). Unnamed Claude-plugin directory submit is a publish. Managed Agents 20-skill cap. Subagents do not inherit unless listed (Claude skills: field). bypassPermissions is not owner approval. De-identified / ZDR / we-don't-train is not a vault; opt-out is not a rewind. API no-train is not ChatGPT no-train. Skills/Agents/Files/Conversations/chatkit/batches/videos/fine-tuning are ZDR-ineligible. Anthropic Skills retain definitions and execution data. Covered-model 30-day safety retention can apply even on ZDR orgs. Protected-lane check: map consumer chat vs API/local/open-source; do not claim a plan is the vault. Shared Bot computer is account-wide (files, sessions, logins). Screens are not security boundaries; Bot-to-Bot DM / group chat is a hop; delete Bot does not wipe the computer; Enterprise terminate-computer keeps the durable disk; isolated credentials need a dedicated user. Auto Review does not review memory writes. Marketplace job-taking is access grant + send + computer-use. Custom Skills do not sync across Anthropic surfaces. Agents API capability_directories max 32. One focused skill — do not merge with correspondence/persona skills. Never email leftover drafts or partner pre-reads unless this turn names recipient AND action. Done requires path+link. Truncated/placeholder files are not originals. Skill zip is scanned — no secrets. Builder worksheet — not legal advice."

policy:
  allow_implicit_invocation: true
