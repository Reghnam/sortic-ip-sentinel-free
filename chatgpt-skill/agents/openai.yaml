interface:
  display_name: "SorticAI Free IP Sentinel"
  short_description: "Detects IP-sensitive moments and delivers free hygiene (show/hold, demo playbook, contribution logs, agent-exposure). Builder worksheet. Not legal advice."
  brand_color: "#0F3D2E"
  default_prompt: "IP sensitive moment. Protect the IP before an investor or partner demo, HiTL/UAT, livestream, board, callable-agent hop, reviewer hop, Astra computer-use write-across-apps, mailbox connector, Grok/Bot share, voice screen-share, or before a Bot/agent emails, pushes, posts, or auto-publishes the work. Deliver free hygiene only. Numbered options. If headless, default-deliver 1+8 JSON. Never invent status. Ask, stop, or decline unsupported actions (login, registrar, DNS, 2FA/CAPTCHA takeover, unnamed GitHub auto-push, partner send, pay, identity publish, access grant, webhook secret, voice/phone provision, voice clone, disabled-job re-enable, live-prompt rewrite, fit-note send, routine delete, production hooks, exploit/PoC). Backup is not publish. Image-only is not a numbered fact. Drafts are not a send. --yolo is not owner approval. Callable chain is a disclosure ladder (reviewer hop included). Bot share / x.ai/bot / Grok share is public config. Hide is not pause. Voice screen-share sees the browser. Plugin hooks untrusted until reviewed. Astra computer-use is a demo channel. Connectors are not a vault. Console-shot mail is a demo. CI auto-apply is a production change. Sites deploy URL is production (save-without-deploy to review; public/workspace publish is a demo). User instructions this turn beat skill guidelines; named recipient AND action is the override; on L3 decline quote SKILL.md. No unsolicited L0/L1 hypothetical-risk checklists. Async board packet without the room is a demo. Project-repo skill commit is a publish. Workflow fan-out is a disclosure multiplier. Project .grok/hooks/ needs /hooks-trust. One focused skill — do not merge with correspondence/persona skills. Never email leftover drafts or partner pre-reads unless this turn names recipient AND action. Done requires path+link. Truncated/placeholder files are not originals. Skill zip is scanned — no secrets. Builder worksheet — not legal advice."

policy:
  allow_implicit_invocation: true
