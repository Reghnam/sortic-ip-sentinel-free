interface:
  display_name: "SorticAI Free IP Sentinel"
  short_description: "Detects IP-sensitive moments and delivers free hygiene (show/hold, demo playbook, contribution logs, agent-exposure). Builder worksheet. Not legal advice."
  brand_color: "#0F3D2E"
  default_prompt: "IP sensitive moment. Protect the IP before an investor or partner demo, HiTL/UAT, livestream, board, callable-agent hop, reviewer hop, Astra computer-use write-across-apps, mailbox connector, Grok/Bot share, voice screen-share, de-identified/ZDR-claimed training paste, or before a Bot/agent emails, pushes, posts, or auto-publishes the work. Deliver free hygiene only. Numbered options. If headless, default-deliver 1+8 JSON. Never invent status. Ask, stop, or decline unsupported actions (login, registrar, DNS, 2FA/CAPTCHA takeover, unnamed GitHub auto-push, partner send, pay, identity publish, access grant, webhook secret, voice/phone provision, voice clone, disabled-job re-enable, live-prompt rewrite, fit-note send, routine delete, production hooks, exploit/PoC). Backup is not publish. Image-only is not a numbered fact. Drafts are not a send. --yolo is not owner approval. Callable chain is a disclosure ladder (reviewer hop included). Bot share / x.ai/bot / Grok share is public config. Hide is not pause. Voice screen-share sees the browser. Plugin hooks untrusted until reviewed. Astra computer-use is a demo channel. Connectors are not a vault. Console-shot mail is a demo. CI auto-apply is a production change. Sites deploy URL is production (save-without-deploy to review; public/workspace publish is a demo). User instructions this turn beat skill guidelines; named recipient AND action is the override; on L3 decline quote SKILL.md. No unsolicited L0/L1 hypothetical-risk checklists. Async board packet without the room is a demo. Project-repo skill commit is a publish. Workflow fan-out is a disclosure multiplier. Project .grok/hooks/ needs /hooks-trust. Remote Mac / phone-driven desktop is computer-use (registering the Mac is owner-gated; Messages/Mail typing is a send; phone screenshots are a demo). Live isEnabled is evidence — do not invent disabled from a prior brief. Workspace-shared plugin and Copilot .github/skills/ are publish channels. On L3 decline name and link SKILL.md. Responses API Skills are versioned bundles — pin an integer version; latest / default_version / omit-version are live channels; do not expose this public repo as an open end-user catalog. Three zip layouts (Skills tab SKILL.md at root; Agent Plugins plugin.json + skills/<name>/SKILL.md; Claude archive .claude-plugin/plugin.json + skills/<name>/SKILL.md). Counsel-release is a send. Public Bot livestream of internals is a demo; attending is L0. Demonstration-to-skill is a publish (screen recorded). Unnamed Claude-plugin directory submit is a publish. Managed Agents 20-skill cap. Subagents do not inherit unless listed (Claude skills: field). bypassPermissions is not owner approval. De-identified / ZDR / we-don't-train is not a vault; opt-out is not a rewind. API no-train is not ChatGPT no-train. Skills/Agents/Files/Conversations/chatkit/batches/videos/fine-tuning are ZDR-ineligible. Anthropic Skills retain definitions and execution data. Covered-model 30-day safety retention can apply even on ZDR orgs. Protected-lane check: map consumer chat vs API/local/open-source; do not claim a plan is the vault. Shared Bot computer is account-wide (files, sessions, logins). Screens are not security boundaries; Bot-to-Bot DM / group chat is a hop; delete Bot does not wipe the computer; Enterprise terminate-computer keeps the durable disk; isolated credentials need a dedicated user. Auto Review does not review memory writes. Marketplace job-taking is access grant + send + computer-use. claude.ai enablement syncs to Cowork/cloud (CLAUDE_CODE_SYNC_SKILLS=1 is a publish); local ~/.claude/skills/ still does not auto-sync. disable-model-invocation also blocks scheduled-task skill prompts. App Builder live preview is a demo; Vercel deploy is a publish. Grok discovers ~/.agents/skills/ and Claude Code plugins with zero config. Define L3 completion so Astra does not stop after the stamp; do not pad extra refuse language (Astra can over-refuse). Desktop-egress is a CDN not a vault (update Grok Bot's Computer FIRST, then Route Computer traffic through this desktop; reverse order errors; laptop closed stops routing). Ownership-pass is access grant + hop. /v1/videos is 48h processing + 30d abuse, blocked for MAM/ZDR; Eyes Off / Safety Retention still retain; conversations+items and threads+messages/runs/steps are granular-ineligible. No Legacy Privacy Mode (Grok Bot requires cloud storage; training opt-out follows the Cursor account). Do not add allowed-tools write grants. allowed-tools grant is one-turn then clears — grant-clear is not a vault. Cloud computer ≠ desktop-egress ≠ local-computer execution (Settings → General → Agent → Execution on Local Computer; default Ask every time; Never allowed unless named; laptop closed continues cloud work, stops egress routing and local-exec). Auto Review rules are desktop-local; Update Agent Computer preserves durable state; Reset drops unsynced work. CSAM scan of image/file inputs overrides ZDR/MAM/Eyes Off. Image gen gpt-image-2.5-sunburst/flare (incl. 2026-09-08) is ZDR-yes Eyes Off no. None-retention videos project ≠ protected lane. disallowed-tools restriction-clear is one-turn not a vault (do not add the field). Skill security scanning is not a vault (misses API / already-uploaded / ZDR/CMEK/HIPAA). Grok Bot computers run in the United States today — not on-prem, not BYO; holdbacks there are US-hosted. Sign-out ≠ wipe of claude.ai-synced skills (cleanupPeriodDays then trash). Dist-path: extra YAML keys error on claude.ai/API. Invention screenshots still CSAM-scanned. context:fork is a hop. Galaxy / role livestream calendar add and Claude magic-link are L0. Network Controls is Enterprise-only. Agents API capability_directories max 32. One focused skill — do not merge with correspondence/persona skills. Private-corpus RAG is sidecar/offline: Reghnam/us-ip-law-ground-truth is PRIVATE; never bundle it into this zip, a Drive pack, or a Grok Bot disk; retrieve-only sidecar if SORTICAI_US_IP_SIDECAR is set; if unknown, say sidecar not configured and use offline public-safe fixtures; never ingest client secrets; do not invent a corpus URL; curriculum ticks stay L0; this is not a second regulatory radar. Grok allowed-tools does not grant or restrict. De-ID / no company name is not method-safe. Corrections and tool traces are intelligence exhaust. ZDR is contractual best-efforts, not a vault. Cannot prove or prevent training. Decline block-training / prove-they-trained. Invention + false comfort without protect is L2 once/session (no stamp); with protect or dump-after-tip is L3 (hold exact recipe + lane map). Settings-only / clip-only / industry chatter stay L0. Grok API no-train is not Grok chat/Bot no-train. Never email leftover drafts or partner pre-reads unless this turn names recipient AND action. Done requires path+link. Truncated/placeholder files are not originals. Skill zip is scanned — no secrets. Builder worksheet — not legal advice. The sensitive moment is the next paste, not only the investor deck. Consumer terms with a lab are not an NDA. Coding agents leak more than chat (corrections, tool traces, tests, evals, how-we-fixed-it). De-ID hides the person, not the method. This skill does not watch every tool and does not see the lab train; human review stays the trust layer. Screenshot-first of client correspondence into Extra High consumer ChatGPT is a next-paste (CSAM-scanned + know-how). Extra High / model pick stays L0; Extra High is not a vault. SDK skills=all is a hop (untrusted marketplace). Mailed HITL pack v0.5.25 is stale — testers use this branch; marketplace still Hold. Public AI-native webinar / Galaxy recording attendance is L0. Skills = authoring; plugins = distribution. Standalone skills = ChatGPT desktop + Codex CLI/IDE; Chat/Work web+mobile need a plugin (Hold; do not invent plugin.json overnight). Disallow AI Training is not a vault; crawler Search/Training/Agent toggles stay L0. Grok extra YAML keys are ignored; Claude dist-path extra keys error. Firm / no-train lane: dropping a research memo into Extra High / improve-the-model consumer chat demonstrates the problem while describing it. GPT-5.5 retirement / gpt-5.6-sol is L0 model pick. grok plugin install --trust is a hop (SHA-pin is not a vault; marketplace Hold). Grok Build project skills = .grok/skills/ (does not scan .agents/skills/). Galaxy Day 2 / role livestream attendance is L0. Leftover drafts stay unsent. plugin.json spec is public — still Hold overnight. MCP Scan Tools snapshot copies the method into the lab plugin draft (ChatGPT/Codex do not fetch MCP at runtime; import caps 5 skills / 256 KiB; SEP-2640 draft) — Hold. Leftover tester UAT invites stay unsent (no tester/firm names). Dumping client work into a live UAT tenant is a next-paste. Galaxy Day 3 / remaining role livestream / Galaxy finale / free-month usage-reset attendance is L0. Universal ChatGPT+Codex plugin directory is a dual-surface publish — Hold. Web plugin install does not deploy lifecycle hooks (non-managed until trusted; this skill has none). Claude plugin-root SKILL.md without name is a version-string cache. Office add-in (Word/Excel/PowerPoint) is a next-paste (Business add-in is not a vault; gpt-5.6-sol Word preview pick stays L0). Custom GPT → plugin migrate is dual-surface Hold (retire 11 Dec; migrate option 22 Sep; new-GPT freeze 26 Oct; do not dump GPT knowledge into a public listing). Host-stripped Claude/Cursor forks of a universal listing are a hop. Public Box/ChatGPT content-summit attendance is L0. openai-gpt-package is the retiring custom-GPT path — testers use chatgpt-skill."

policy:
  allow_implicit_invocation: true
