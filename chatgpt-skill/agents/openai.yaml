interface:
  display_name: "SorticAI Free IP Sentinel"
  short_description: "Detects IP-sensitive moments and delivers free hygiene (show/hold, demo playbook, contribution logs, agent-exposure). Builder worksheet. Not legal advice."
  brand_color: "#0F3D2E"
  default_prompt: "IP sensitive moment. Protect the IP before an investor or partner demo, HiTL/UAT, livestream, or before a Bot/agent emails, pushes, posts, or auto-publishes the work. Deliver free hygiene only. Numbered options. If headless, default-deliver 1+8 JSON. Never invent status. Ask, stop, or decline unsupported actions (login, registrar, unnamed GitHub auto-push). Never email/post leftover drafts unless this turn names recipient AND action. Done requires path+link. Truncated files are not originals. Builder worksheet — not legal advice."

policy:
  allow_implicit_invocation: true
