interface:
  display_name: "SorticAI Free IP Sentinel"
  short_description: "Detects IP-sensitive moments and delivers free hygiene (show/hold, demo playbook, contribution logs, agent-exposure). Builder worksheet. Not legal advice."
  brand_color: "#0F3D2E"
  default_prompt: "IP sensitive moment. Protect the IP before an investor or partner demo, HiTL/UAT, livestream, board, callable-agent hop, Bot share / marketplace clone, or before a Bot/agent emails, pushes, posts, or auto-publishes the work. Deliver free hygiene only. Numbered options. If headless, default-deliver 1+8 JSON. Never invent status. Ask, stop, or decline unsupported actions (login, registrar, DNS, 2FA/CAPTCHA takeover, unnamed GitHub auto-push, partner send, pay, identity publish, voice/phone provision, disabled-job re-enable, live-prompt rewrite, fit-note send). Backup is not publish. Image-only is not a numbered fact. --yolo is not owner approval. Callable chain is a disclosure ladder. Never email leftover drafts or partner pre-reads unless this turn names recipient AND action. Done requires path+link. Truncated/placeholder files are not originals. Skill zip is scanned — no secrets. Builder worksheet — not legal advice."

policy:
  allow_implicit_invocation: true
